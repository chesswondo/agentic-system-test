[project]
name = "picos"
version = "0.1.0"
description = "Multi-agent Picos de Europa trip planner (test assignment)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-google-genai",
    "mcp",
    "langchain-mcp-adapters",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "tenacity",
    "typer",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
tracing = ["langsmith"]

[project.scripts]
picos = "picos.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: tests that call the real LLM (need GOOGLE_API_KEY)"]
